version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: medloop-oracle
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "1522:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - medloop-network
    healthcheck:
      test: [ "CMD", "sqlplus", "-L", "system/oracle@//localhost:1521/XEPDB1", "select", "1", "from", "dual" ]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 10

  # Eureka Discovery Service
  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: medloop-discovery
    ports:
      - "8761:8761"
    networks:
      - medloop-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Config Server
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: medloop-config-server
    ports:
      - "8888:8888"
    networks:
      - medloop-network
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/

  # Auth Service (formerly User Service)
  auth-service:
    build:
      context: ./Microservices/auth-service
      dockerfile: Dockerfile
    container_name: medloop-auth-service
    ports:
      - "8082:8082"
    networks:
      - medloop-network
    depends_on:
      oracle:
        condition: service_healthy
      discovery:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=oracle
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888

  # Patient Service
  patient-service:
    build:
      context: ./Microservices/patient-service
      dockerfile: Dockerfile
    container_name: medloop-patient-service
    ports:
      - "8081:8081"
    networks:
      - medloop-network
    depends_on:
      oracle:
        condition: service_healthy
      discovery:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=oracle
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888

  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: medloop-gateway
    ports:
      - "8080:8080"
    networks:
      - medloop-network
    depends_on:
      discovery:
        condition: service_healthy
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888

networks:
  medloop-network:
    driver: bridge

volumes:
  oracle-data:
