name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/application-update ]
  pull_request:
    branches: [ main, develop, feature/application-update ]

jobs:
  # Frontend Build & Test
  frontend-build:
    runs-on: ubuntu-latest
    name: Build Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run format --check || true

  # Backend Build
  backend-build:
    runs-on: ubuntu-latest
    name: Build Backend Services
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Admin Microservice
        working-directory: ./services/admin-microservice
        run: ./mvnw clean package -DskipTests

      - name: Build Hospital Service
        working-directory: ./services/HospitalService
        run: ./mvnw clean package -DskipTests

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Images
    needs: [frontend-build, backend-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build admin-microservice image
        uses: docker/build-push-action@v5
        with:
          context: ./services/admin-microservice
          file: ./services/admin-microservice/Dockerfile
          push: false
          tags: medloop-admin-service:latest

      - name: Build hospital-service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/HospitalService
          file: ./services/HospitalService/Dockerfile
          push: false
          tags: medloop-hospital-service:latest

  # Code Quality Check
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint || true
        continue-on-error: true

  # Notify on completion
  notify:
    runs-on: ubuntu-latest
    name: Pipeline Complete
    needs: [frontend-build, backend-build, docker-build, code-quality]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "✅ CI/CD Pipeline Completed"
          echo "Frontend: Build successful"
          echo "Backend: Build successful"
          echo "Docker: Images built"
          echo "Quality: Check completed"
