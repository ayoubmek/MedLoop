<div class="card">
  <div class="font-semibold text-xl mb-4">Liste des Rendez-vous</div>
  
  <!-- Bouton de création -->
  <p-button 
    label="Ajouter un rendez-vous" 
    icon="pi pi-plus"
    severity="success"
    (onClick)="createAppointment()"
    class="mb-3">
  </p-button>

  <!-- Filters -->
  <div class="mb-4 p-4 surface-card border-round">
    <div class="flex flex-column gap-2 md:flex-row md:gap-3">
      <div class="flex-1">
        <label for="dateFilter" class="text-sm font-semibold block mb-2">Filtrer par date</label>
        <p-datepicker
          id="dateFilter"
          [(ngModel)]="selectedDate"
          (onSelect)="onDateFilterChange($event)"
          (onClearButtonClick)="onDateFilterChange(null)"
          [showIcon]="true"
          dateFormat="dd/mm/yy"
          placeholder="Sélectionner une date"
        ></p-datepicker>
      </div>
      <div class="flex-1">
        <label for="searchInput" class="text-sm font-semibold block mb-2">Rechercher</label>
        <p-iconfield iconPosition="left">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            id="searchInput"
            pInputText
            type="text"
            (input)="onGlobalFilter(dt, $event)"
            placeholder="Rechercher..."
            class="w-full"
          />
        </p-iconfield>
      </div>
    </div>
  </div>

  <p-table
    #dt
    [value]="filteredAppointments"
    [rows]="10"
    [paginator]="true"
    [showGridlines]="true"
    [rowHover]="true"
    responsiveLayout="scroll"
    [globalFilterFields]="['patientName', 'patientId', 'dateTime', 'duration', 'status']"
  >
    <!-- En-têtes -->
    <ng-template #header>
      <tr>
        <th pSortableColumn="patientId">Patient <p-sortIcon field="patientId"></p-sortIcon></th>
        <th pSortableColumn="dateTime">Date et Heure <p-sortIcon field="dateTime"></p-sortIcon></th>
        <th pSortableColumn="duration">Durée <p-sortIcon field="duration"></p-sortIcon></th>
        <th pSortableColumn="status">Statut <p-sortIcon field="status"></p-sortIcon></th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <!-- Corps du tableau -->
    <ng-template #body let-appointment>
      <tr>
        <td>{{ appointment.patientName }} (ID: {{ appointment.patientId }})</td>
        <td>
          <i class="pi pi-calendar mr-1"></i>
          {{ formatDateTime(appointment.dateTime) }}
        </td>
        <td>
          <i class="pi pi-clock mr-1"></i>
          {{ appointment.duration }} min
        </td>
        <td>
          <p-tag 
            [value]="getStatusLabel(appointment.status)"
            [severity]="getStatusSeverity(appointment.status)">
          </p-tag>
        </td>
        <td>
          <button
            pButton
            icon="pi pi-pencil"
            (click)="onEdit(appointment.id!)"
            class="p-button-warning p-button-sm mr-1"
            [disabled]="appointment.status === 'CANCELLED' || appointment.status === 'COMPLETED'"
            pTooltip="Modifier">
          </button>
          <button
            pButton
            icon="pi pi-ban"
            (click)="onCancel(appointment)"
            class="p-button-secondary p-button-sm mr-1"
            [disabled]="appointment.status === 'CANCELLED' || appointment.status === 'COMPLETED'"
            pTooltip="Annuler">
          </button>
          <button
            pButton
            icon="pi pi-trash"
            (click)="onDelete(appointment.id!)"
            class="p-button-danger p-button-sm"
            pTooltip="Supprimer">
          </button>
            <button
              pButton
              icon="pi pi-file"
              (click)="createMedicalRecord(appointment.patientId)"
              class="p-button-info p-button-sm ml-2"
              pTooltip="Créer Dossier Patient">
            </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">Aucun rendez-vous trouvé.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-confirmdialog></p-confirmdialog>
<p-toast></p-toast>
