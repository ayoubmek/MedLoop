<div class="card">
  <div class="font-semibold text-xl mb-4">Liste des Hôpitaux</div>
<!-- Bouton de création -->
    <p-button 
      label="Ajouter un hôpital" 
      icon="pi pi-plus"
      severity="success"
      (onClick)="createHospital()">
    </p-button>
  <p-table
    #dt
    [value]="hospitals"
    [rows]="10"
    [paginator]="true"
    [showGridlines]="true"
    [rowHover]="true"
    responsiveLayout="scroll"
    [globalFilterFields]="['name', 'email', 'phone', 'address']"
  >
  <!-- Dans hospitals-list.component.html -->
<button pButton icon="pi pi-plus" (click)="onCreate()" class="p-button-success mb-3"></button>
    <!-- Barre de recherche -->
    <ng-template #caption>
      <div class="flex justify-between items-center flex-column sm:flex-row">
        <div></div>
        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            (input)="onGlobalFilter(dt, $event)"
            placeholder="Rechercher..."
          />
        </p-iconfield>
      </div>
    </ng-template>
 
    <!-- En-têtes -->
    <ng-template #header>
      <tr>
        <th>Nom</th>
        <th>Adresse</th>
        <th>Téléphone</th>
        <th>Email</th>
        <th>Services</th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <!-- Corps du tableau -->
    <ng-template #body let-hospital>
      <tr>
        <td>{{ hospital.name }}</td>
        <td>{{ hospital.address }}</td>
        <td>{{ hospital.phone }}</td>
        <td>{{ hospital.email }}</td>
        <td>
          <p-tag
            *ngFor="let service of hospital.services"
            [value]="service.name"
            styleClass="mr-1 mb-1"
          />
        </td>
        <td>
          <button
            pButton
            icon="pi pi-pencil"
            (click)="onEdit(hospital.id)"
            class="p-button-warning p-button-sm mr-1"
          ></button>
          <button
            pButton
            icon="pi pi-trash"
            (click)="onDelete(hospital.id)"
            class="p-button-danger p-button-sm"
          ></button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6">Aucun hôpital trouvé.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
